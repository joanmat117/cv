cv:
  name: Joan Matias Dominguez
  headline: FullStack Developer
  location: Matanzas, Cuba
  email: joanmat@proton.me
  photo:
  phone:
  website:
  social_networks:
    - network: LinkedIn
      username: joanmat
    - network: GitHub
      username: joanmat117
  custom_connections:
  sections:
    # --- Professional Summary ---
    summary:
      - Fullstack Developer with 2 years of experience in TypeScript, Next.js and NestJS. Specialized in modular architectures, performance optimization, technical SEO, and advanced authentication systems. Experience in end-to-end projects as the sole frontend developer and in fullstack solutions with AI integration, WebSockets, and Electron.

    # --- Work Experience ---
    experience:
      - company: Qvazo Market
        position: Frontend Developer (Part-Time)
        start_date: 2026-03
        end_date: 2026-08
        location: Remote
        highlights:
          - "Standardized data and interface patterns by defining clear business flows, reducing development by 30% and improving AI effectiveness by narrowing the domain."
          - "Optimized performance and global SEO by migrating to Server Components and SSR, i18n for 4 languages, reducing JS bundle by 25% and improving LCP by 300 ms."
          - "Designed a middleware pipeline with dynamic permissions (RBAC) and automatic JWT renewal, reducing session timeouts by 40% and protecting 9 functional modules."
      - company: Propiedades Aburrá
        position: Frontend Developer (Freelance)
        date:
        start_date: 2026-01
        end_date: 2026-02
        location: Remote
        summary:
        highlights:
          - "Developed a housing price estimator using React 19, Tailwind, shadcn/ui and Zustand"
          - "Achieved 96/100 on PageSpeed, LCP of 1.0s, zero TBT and CLS of 0.001"
          - Implemented auto-save in the form with debounced writes, reducing unnecessary renders and syncing data without interrupting the user.

      - company: Private Community Website
        position: FullStack Developer (Freelance)
        date:
        start_date: 2024-11
        end_date: 2025-11
        location: Remote
        summary:
        highlights:
          - "Developed a community website with React, TailwindCSS and Supabase"
          - "Built OAuth authentication, custom CMS and image upload to ImageKit"
          - "Integrated 5 AI chats (Google Gemini), real-time chat and a desktop application with Electron"

    # --- Projects ---
    projects:
      - name: Cryptocurrency Data Backend
        date:
        start_date: 2026-02
        end_date: 2026-04
        location:
        summary: REST API for cryptocurrencies developed with NestJS, PostgreSQL (Neon) and Prisma ORM.
        highlights:
          - "Designed passwordless authentication with secret phrases (argon2id) and JWT rotation, detecting session theft in real-time."
          - "Implemented hierarchical rate limiting with ThrottlerGuard, protecting sensitive endpoints and blocking brute-force attacks."

      - name: Online Bible
        date:
        start_date: 2025-10
        end_date: 2025-11
        location:
        summary: Bible reading web application developed with Next.js 14, React 18, Redux Toolkit.
        highlights:
          - "Refactored to a feature-oriented architecture, isolating 8+ modules by domain and reducing coupling between layers."
          - Implemented offline persistence with Dexie (IndexedDB) and deep-linking via URL for shareable navigation.

      # - name: Energía Ideal
      #   date:
      #   start_date: 2025-07
      #   end_date: 2025-08
      #   location:
      #   summary: News website developed with Next.js 14, Supabase (PostgreSQL) and Tailwind, with a focus on SEO.
      #   highlights:
      #     - Implemented advanced technical SEO with dynamic sitemap from DB, canonical URLs and hreflang, improving indexing and organic positioning.

    # --- Technical Skills ---
    technical_skills:
      - label: Languages
        details: TypeScript, JavaScript, SQL, CSS, HTML
      - label: Frameworks and Libraries
        details: Next.js, React, NestJS, Express, PostgreSQL, Redux Toolkit, Node.js
      - label: Tools and Practices
        details: RESTful APIs, OAuth, Docker, Git, Agile Methodologies

    # --- Languages ---
    languages:
      - "Spanish: Native"
      - "English: Intermediate"

