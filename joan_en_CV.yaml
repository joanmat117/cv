cv:
  name: Joan Matias Dominguez
  headline: FullStack Developer
  location: Matanzas, Cuba
  email: joanmat@proton.me
  photo:
  phone:
  website:
  social_networks:
    - network: LinkedIn
      username: joanmat
    - network: GitHub
      username: joanmat117
  custom_connections:
  sections:
    # --- Professional Summary ---
    summary:
      - FullStack Developer with 2 years of experience specialized in TypeScript, React, Next.js, NestJS, and Python. Extensive experience in AI-driven development, language model integration into web applications, payment gateway integration, and automated testing (unit and E2E tests using Cypress, Jest, and Vitest). Proven ability in software architecture, scalable system design, and optimized backend/frontend development (caching with Redis, processing queues, WebSockets, and modular architectures).

    # --- Work Experience ---
    experience:
      # - company: Desoft
      #   position: Odoo & Frontend Developer
      #   start_date: 2026-10
      #   end_date: present
      #   location: On-site
      #   highlights:
      #     - Developed and extended custom Odoo modules using Python, applying design patterns for system maintainability.
      #     - Refactored legacy code optimizing database queries and reducing code duplication in business logic.
      #     - Authored technical documentation for RESTful APIs to facilitate intermodular service consumption.
      #
      - company: Qvazo Market
        position: Frontend Developer
        start_date: 2026-03
        end_date: 2026-08
        location: Remote
        highlights:
          - Standardized data patterns and interfaces by scoping the software domain, increasing AI-generated code efficacy and reducing development time by 30%.
          - Migrated the application to Server Components (Next.js) with i18n for 4 languages, reducing JS bundle by 25% and improving LCP by 300 ms.
          - Integrated the Tropipay payment gateway for secure financial transaction processing in the e-commerce platform.
          - Designed a middleware pipeline with dynamic permissions (RBAC) and automatic JWT renewal, protecting 9 modules and reducing session timeouts by 40%.
      - company: Propiedades Aburrá
        position: Frontend Developer (Freelance)
        start_date: 2026-01
        end_date: 2026-02
        location: Remote
        highlights:
          - Developed an interactive housing price estimator using React 19, Tailwind CSS, shadcn/ui, and Zustand.
          - Implemented deferred writing (debounce) in forms to persist data without interrupting user experience or generating unnecessary renders.
          - Achieved 96/100 PageSpeed performance with LCP of 1.0s, TBT of 0ms, and CLS of 0.001.

      - company: Private Community Website
        position: FullStack Developer (Freelance)
        start_date: 2024-11
        end_date: 2025-11
        location: Remote
        highlights:
          - Integrated 5 conversational chats based on the Google Gemini API for real-time AI interaction.
          - Implemented bidirectional real-time communication for chat systems and a cross-platform desktop application with Electron.
          - Developed a FullStack architecture with React, Tailwind CSS, and Supabase, including OAuth authentication, custom CMS, and multimedia optimization with ImageKit.

    # --- Projects ---
    projects:
      - name: AI Recruiter
        summary: Distributed asynchronous backend system for intelligent CV analysis and matching against job vacancies.
        highlights:
          - Built an evaluation engine with AI agents (LangGraph and LangChain) that processes candidate profiles, validates requirements, and generates structured hiring recommendations.
          - Designed an asynchronous architecture based on processing queues (BullMQ and Redis) to manage document extraction and AI pipelines at scale.
          - Integrated relational storage in PostgreSQL using Drizzle ORM structured under Clean Architecture principles and domain isolation.

      - name: Cryptocurrency Data Backend
        summary: REST API for cryptocurrency analysis built with NestJS, PostgreSQL, and Prisma ORM.
        highlights:
          - Designed passwordless authentication via secret phrases (argon2id) and JWT token rotation with real-time session theft detection.
          - Implemented hierarchical rate limiting with ThrottlerGuard to mitigate brute-force attacks on sensitive endpoints.

      # - name: Online Bible
      #   date:
      #   start_date: 2025-10
      #   end_date: 2025-11
      #   location:
      #   summary: Bible reading web application developed with Next.js 14, React 18, Redux Toolkit.
      #   highlights:
      #     - "Refactored to a feature-oriented architecture, isolating 8+ modules by domain and reducing coupling between layers."
      #     - Implemented offline persistence with Dexie (IndexedDB) and deep-linking via URL for shareable navigation.

      # - name: Energía Ideal
      #   date:
      #   start_date: 2025-07
      #   end_date: 2025-08
      #   location:
      #   summary: News website developed with Next.js 14, Supabase (PostgreSQL) and Tailwind, with a focus on SEO.
      #   highlights:
      #     - Implemented advanced technical SEO with dynamic sitemap from DB, canonical URLs and hreflang, improving indexing and organic positioning.

    # --- Technical Skills ---
    technical_skills:
      - label: AI & LLMs
        details: LangChain, LangGraph, RAG, AI-driven development.
      - label: Languages
        details: TypeScript, JavaScript, Python, SQL, CSS, HTML
      - label: Frontend
        details: Next.js, React, Astro, Redux, Zustand, Tailwind CSS.
      - label: Backend
        details: NestJS, Node.js, Express, WebSockets, BullMQ (Queues), Caching with Redis.
      - label: Databases & Tools
        details: PostgreSQL, Drizzle ORM, Prisma ORM, Supabase, Docker, Git.

    # --- Languages ---
    languages:
      - "Spanish: Native"
      - "English: Intermediate"

