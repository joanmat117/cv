cv:
  name: Joan Matias Dominguez
  headline: Desarrollador FullStack
  location: Matanzas, Cuba
  email: joanmat@proton.me
  photo:
  phone:
  website:
  social_networks:
    - network: LinkedIn
      username: joanmat
    - network: GitHub
      username: joanmat117
  custom_connections:
  sections:
    # --- Resumen Profesional ---
    resumen:
      - Desarrollador Fullstack con 2 años de experiencia en TypeScript, Next.js y NestJS. Especializado en arquitecturas modulares, optimización de rendimiento, SEO técnico y sistemas de autenticación avanzada. Experiencia en proyectos end-to-end como único frontend y en soluciones fullstack con integración de IA, WebSockets y Electron.

    # --- Experiencia Laboral ---
    experiencia:
      - company: Qvazo Market
        position: Desarrollador Frontend (Tiempo Parcial)
        start_date: 2026-03
        end_date: 2026-08
        location: Remoto
        highlights:
          - "Estandaricé patrones de datos e interfaz definiendo flujos de negocio claros, reduciendo el desarrollo un 30% y mejorando eficacia de IA al acotar el dominio."
          - "Optimicé el rendimiento y SEO global migrando a Server Components y SSR, i18n para 4 idiomas, reduciendo bundle JS un 25% y mejorando LCP en 300 ms."
          - "Diseñé un pipeline de middleware con permisos dinámicos (RBAC) y renovación automática de JWT, reduciendo timeouts de sesión un 40% y protegiendo 9 módulos funcionales."
      - company: Propiedades Aburrá
        position: Desarrollador Frontend (Freelance)
        date:
        start_date: 2026-01
        end_date: 2026-02
        location: Remoto
        summary:
        highlights:
          - "Desarrollé un estimador de precios de viviendas usando React 19, Tailwind, shadcn/ui y Zustand"
          - "Logré 96/100 en PageSpeed, LCP de 1.0s, TBT cero y CLS de 0.001"
          - Implementé auto-guardado en el formulario con escritura diferida, reduciendo renders innecesarios y sincronizando los datos sin interrumpir al usuario.

      - company: Sitio Web de Comunidad Privada
        position: Desarrollador FullStack (Freelance)
        date:
        start_date: 2024-11
        end_date: 2025-11
        location: Remoto
        summary:
        highlights:
          - "Desarrollé un sitio web comunitario con React, TailwindCSS y Supabase"
          - "Construí autenticación OAuth, CMS personalizado y carga de imágenes a ImageKit"
          - "Integré 5 chats de IA (Google Gemini), chat en tiempo real y una aplicación de escritorio con Electron"

    # --- Proyectos ---
    proyectos:
      - name: Cryptocurrency Data Backend
        date:
        start_date: 2026-02
        end_date: 2026-04
        location:
        summary: API REST para criptomonedas desarrollada con NestJS, PostgreSQL (Neon) y Prisma ORM.
        highlights:
          - "Diseñé autenticación sin contraseñas con secret phrases (argon2id) y rotación de JWT, detectando robo de sesiones en tiempo real."
          - "Implementé rate limiting jerárquico con ThrottlerGuard, protegiendo endpoints sensibles y bloqueando ataques de fuerza bruta."

      - name: Online Bible
        date:
        start_date: 2025-10
        end_date: 2025-11
        location:
        summary: Aplicación web de lectura bíblica desarrollada con Next.js 14, React 18, Redux Toolkit.
        highlights:
          - "Refactoricé a una arquitectura orientada a features, aislando 8+ módulos por dominio y reduciendo el acoplamiento entre capas."
          - Implementé persistencia offline con Dexie (IndexedDB) y deep-linking vía URL para navegación compartible.

      # - name: Energía Ideal
      #   date:
      #   start_date: 2025-07
      #   end_date: 2025-08
      #   location:
      #   summary: Web de noticias desarrollada con Next.js 14, Supabase (PostgreSQL) y Tailwind, con foco en SEO.
      #   highlights:
      #     - Implementé SEO técnico avanzado con sitemap dinámico desde BD, URLs canónicas y hreflang, mejorando la indexación y el posicionamiento orgánico.

    # --- Habilidades Técnicas ---
    Habilidades Técnicas:
      - label: Lenguajes
        details: TypeScript, JavaScript, SQL, CSS, HTML
      - label: Frameworks y Librerías
        details: Next.js, React, NestJS, Express, PostgreSQL, Redux Toolkit, Node.js
      - label: Herramientas y Prácticas
        details: APIs RESTful, OAuth, Docker, Git, Metodologías Ágiles

    # --- Idiomas ---
    idiomas:
      - "Español: Nativo"
      - "Inglés: Intermedio"

